name: ci

# Typecheck, lint, and unit tests across the workspace (COURSECAL.md §11.3).
# Needs no secrets: unit tests stub the LLM client and never touch the DB or
# Calendar. The parser eval gate runs separately in evals.yml.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
